<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">PlanMo アイコンデザイン候補 4案</title>
  <desc id="desc">アイデアを立体化する、共創キューブ、モデラーとつながる、PlanMoモノグラムの4つのアプリアイコン案</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3478F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17345E" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1600" height="650" fill="#F5F8FC"/>
  <text x="56" y="57" fill="#142B4D" font-family="Inter, 'Noto Sans JP', sans-serif" font-size="27" font-weight="750">PlanMo アイコン候補</text>
  <text x="56" y="89" fill="#64748B" font-family="Inter, 'Noto Sans JP', sans-serif" font-size="14">プランナーのアイデアとモデラーの技術が出会う、共創プラットフォーム</text>
  <g font-family="Inter, 'Noto Sans JP', sans-serif">
    <g transform="translate(36 122)" filter="url(#shadow)">
      <rect width="365" height="470" rx="24" fill="#FFFFFF" stroke="#E3EAF3"/>
      <circle cx="31" cy="31" r="15" fill="#EAF1FF"/><text x="31" y="36" text-anchor="middle" fill="#2459C5" font-size="13" font-weight="700">1</text>
      <rect x="92" y="54" width="180" height="180" rx="42" fill="url(#blue)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M182 103 225 128 182 153 139 128Z"/>
        <path d="M139 128v49l43 25 43-25v-49"/>
        <path d="M182 153v49"/>
      </g>
      <path d="M131 91 137 105 151 111 137 117 131 131 125 117 111 111 125 105Z" fill="#FBBF24"/>
      <circle cx="220" cy="91" r="4" fill="#FDE68A"/>
      <text x="182.5" y="291" text-anchor="middle" fill="#17345E" font-size="20" font-weight="700">アイデアを立体へ</text>
      <text x="182.5" y="322" text-anchor="middle" fill="#64748B" font-size="13">ひらめきが3D作品になる瞬間</text>
      <text x="182.5" y="365" text-anchor="middle" fill="#334155" font-size="13">電球の親しみやすさを残しながら、</text>
      <text x="182.5" y="387" text-anchor="middle" fill="#334155" font-size="13">PlanMoのものづくりを追加</text>
    </g>
    <g transform="translate(425 122)" filter="url(#shadow)">
      <rect width="365" height="470" rx="24" fill="#FFFFFF" stroke="#E3EAF3"/>
      <circle cx="31" cy="31" r="15" fill="#EAF1FF"/><text x="31" y="36" text-anchor="middle" fill="#2459C5" font-size="13" font-weight="700">2</text>
      <rect x="92" y="54" width="180" height="180" rx="42" fill="url(#blue)"/>
      <path d="M182 91 225 116 182 141 139 116Z" fill="#FFFFFF"/>
      <path d="M139 116v49l43 25v-49Z" fill="#F8FAFC"/>
      <path d="M225 116v49l-43 25v-49Z" fill="#DBEAFE"/>
      <path d="M182 141v49" stroke="#9DBCFB" stroke-width="3"/>
      <path d="M175 91 182 78 189 91" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="182" cy="75" r="4" fill="#FBBF24"/>
      <text x="182.5" y="291" text-anchor="middle" fill="#17345E" font-size="20" font-weight="700">共創のキューブ</text>
      <text x="182.5" y="322" text-anchor="middle" fill="#64748B" font-size="13">異なる力がひとつの作品に</text>
      <text x="182.5" y="365" text-anchor="middle" fill="#334155" font-size="13">シンプルで小さくても見分けやすく、</text>
      <text x="182.5" y="387" text-anchor="middle" fill="#334155" font-size="13">サービス内容が直感的</text>
    </g>
    <g transform="translate(814 122)" filter="url(#shadow)">
      <rect width="365" height="470" rx="24" fill="#FFFFFF" stroke="#E3EAF3"/>
      <circle cx="31" cy="31" r="15" fill="#EAF1FF"/><text x="31" y="36" text-anchor="middle" fill="#2459C5" font-size="13" font-weight="700">3</text>
      <rect x="92" y="54" width="180" height="180" rx="42" fill="url(#blue)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M126 124c17-26 38-39 56-39 19 0 40 13 57 39"/>
        <path d="M126 143c17 26 38 39 56 39 19 0 40-13 57-39"/>
      </g>
      <circle cx="126" cy="133.5" r="13" fill="#FBBF24" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="239" cy="133.5" r="13" fill="#67E8F9" stroke="#FFFFFF" stroke-width="4"/>
      <path d="M182 104 204 117v26l-22 13-22-13v-26Z" fill="#FFFFFF"/>
      <path d="M182 130v26M160 117l22 13 22-13" fill="none" stroke="#B8CDF9" stroke-width="3"/>
      <text x="182.5" y="291" text-anchor="middle" fill="#17345E" font-size="20" font-weight="700">つながる共創</text>
      <text x="182.5" y="322" text-anchor="middle" fill="#64748B" font-size="13">企画する人と形にする人をつなぐ</text>
      <text x="182.5" y="365" text-anchor="middle" fill="#334155" font-size="13">マッチングの価値を強く表現。</text>
      <text x="182.5" y="387" text-anchor="middle" fill="#334155" font-size="13">少しだけ抽象度の高い案</text>
    </g>
    <g transform="translate(1203 122)" filter="url(#shadow)">
      <rect width="365" height="470" rx="24" fill="#FFFFFF" stroke="#E3EAF3"/>
      <circle cx="31" cy="31" r="15" fill="#EAF1FF"/><text x="31" y="36" text-anchor="middle" fill="#2459C5" font-size="13" font-weight="700">4</text>
      <rect x="92" y="54" width="180" height="180" rx="42" fill="url(#blue)"/>
      <path d="M132 99h32c19 0 30 10 30 26 0 16-11 26-30 26h-12v29h-20Z" fill="#FFFFFF"/>
      <path d="M185 180v-55l23 26 23-26v55" fill="none" stroke="#FBBF24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M224 90 229 101 240 106 229 111 224 122 219 111 208 106 219 101Z" fill="#FFFFFF"/>
      <text x="182.5" y="291" text-anchor="middle" fill="#17345E" font-size="20" font-weight="700">PlanMoモノグラム</text>
      <text x="182.5" y="322" text-anchor="middle" fill="#64748B" font-size="13">PとMをひとつのシンボルに</text>
      <text x="182.5" y="365" text-anchor="middle" fill="#334155" font-size="13">ブランド名と結びつく独自性。</text>
      <text x="182.5" y="387" text-anchor="middle" fill="#334155" font-size="13">長期的なブランド展開に向く</text>
    </g>
  </g>
  <text x="56" y="626" fill="#64748B" font-family="Inter, 'Noto Sans JP', sans-serif" font-size="12">おすすめ：2「共創のキューブ」— サービス内容が伝わりやすく、縮小表示でも形が保ちやすい案</text>
</svg>