      <circle cx="31" cy="31" r="15" fill="#EAF1FF"/><text x="31" y="36" text-anchor="middle" fill="#2459C5" font-size="13" font-weight="700">A</text>
      <rect x="110" y="52" width="180" height="180" rx="42" fill="url(#blue)"/>
      <path d="M145 139C153 91 177 76 207 104" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
      <path d="M255 139C247 91 223 76 193 104" fill="none" stroke="#B8F2FA" stroke-width="8" stroke-linecap="round"/>
      <circle cx="145" cy="139" r="7" fill="#FBBF24" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="255" cy="139" r="7" fill="#B8F2FA" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M200 100 230 117 200 134 170 117Z" fill="#FFFFFF"/>
      <path d="M170 117 200 134 200 169 170 152Z" fill="url(#face)"/>
      <path d="M230 117 200 134 200 169 230 152Z" fill="#C7DBFF"/>
      <path d="M170 117 200 134 230 117M200 134v35" fill="none" stroke="#9AB7EE" stroke-width="2"/>
      <path d="M196 94 200 86 204 94" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="200" y="286" text-anchor="middle" fill="#17345E" font-size="20" font-weight="700">ペアアーチ</text>
      <text x="200" y="316" text-anchor="middle" fill="#64748B" font-size="13">二つの流れが作品へ集まる</text>
      <text x="200" y="366" text-anchor="middle" fill="#334155" font-size="13">柔らかく親しみやすい。</text>
      <text x="200" y="388" text-anchor="middle" fill="#334155" font-size="13">現行アイコンから自然に移行</text>
    </g>
    <g transform="translate(600 122)" filter="url(#shadow)">
      <rect width="400" height="470" rx="24" fill="#FFFFFF" stroke="#E3EAF3"/>
      <circle cx="31" cy="31" r="15" fill="#EAF1FF"/><text x="31" y="36" text-anchor="middle" fill="#2459C5" font-size="13" font-weight="700">B</text>
      <rect x="110" y="52" width="180" height="180" rx="42" fill="url(#blue)"/>
      <path d="M165 149C139 135 137 99 158 83 177 69 193 84 198 104" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
      <path d="M235 149C261 135 263 99 242 83 223 69 207 84 202 104" fill="none" stroke="#B8F2FA" stroke-width="8" stroke-linecap="round"/>
      <circle cx="165" cy="149" r="6" fill="#FBBF24" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="235" cy="149" r="6" fill="#B8F2FA" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M200 104 230 121 200 138 170 121Z" fill="#FFFFFF"/>
      <path d="M170 121 200 138 200 173 170 156Z" fill="url(#face)"/>
      <path d="M230 121 200 138 200 173 230 156Z" fill="#C7DBFF"/>
      <path d="M170 121 200 138 230 121M200 138v35" fill="none" stroke="#9AB7EE" stroke-width="2"/>
      <circle cx="200" cy="89" r="3" fill="#FFFFFF"/>
      <text x="200" y="286" text-anchor="middle" fill="#17345E" font-size="20" font-weight="700">デュアルオービット</text>
      <text x="200" y="316" text-anchor="middle" fill="#64748B" font-size="13">二つの軌道が作品を包む</text>
      <text x="200" y="366" text-anchor="middle" fill="#334155" font-size="13">動きと先進性があり、</text>
      <text x="200" y="388" text-anchor="middle" fill="#334155" font-size="13">ブランドの印象が強い</text>
    </g>
    <g transform="translate(1075 122)" filter="url(#shadow)">
      <rect width="400" height="470" rx="24" fill="#FFFFFF" stroke="#E3EAF3"/>
      <circle cx="31" cy="31" r="15" fill="#EAF1FF"/><text x="31" y="36" text-anchor="middle" fill="#2459C5" font-size="13" font-weight="700">C</text>
      <rect x="110" y="52" width="180" height="180" rx="42" fill="url(#blue)"/>
      <path d="M147 132C159 132 165 121 177 121M253 132C241 132 235 121 223 121" fill="none" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
      <path d="M147 147C159 147 165 158 177 158M253 147C241 147 235 158 223 158" fill="none" stroke="#B8F2FA" stroke-width="7" stroke-linecap="round"/>
      <circle cx="145" cy="139" r="7" fill="#FBBF24" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="255" cy="139" r="7" fill="#B8F2FA" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M200 99 230 116 200 133 170 116Z" fill="#FFFFFF"/>
      <path d="M170 116 200 133 200 168 170 151Z" fill="url(#face)"/>
      <path d="M230 116 200 133 200 168 230 151Z" fill="#C7DBFF"/>
      <path d="M170 116 200 133 230 116M200 133v35" fill="none" stroke="#9AB7EE" stroke-width="2"/>
      <path d="M196 93 200 85 204 93" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="200" y="286" text-anchor="middle" fill="#17345E" font-size="20" font-weight="700">リンクノード</text>
      <text x="200" y="316" text-anchor="middle" fill="#64748B" font-size="13">二者の接点をキューブに集約</text>
      <text x="200" y="366" text-anchor="middle" fill="#334155" font-size="13">最もミニマルで視認性が高く、</text>
      <text x="200" y="388" text-anchor="middle" fill="#334155" font-size="13">小さい表示にも強い</text>
    </g>
  </g>
  <text x="56" y="626" fill="#64748B" font-family="Inter, 'Noto Sans JP', sans-serif" font-size="12">方向性の違い：A 親しみやすさ　／　B 先進性　／　C シンプルさ・視認性</text>
</svg>