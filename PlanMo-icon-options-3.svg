<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">PlanMo 共創アイコン 3案</title>
  <desc id="desc">プランナーとモデラーが立体キューブを中心につながる、アーチ・オービット・コネクションの3案</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3478F6"/><stop offset="1" stop-color="#1747BD"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6F0FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17345E" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1600" height="650" fill="#F5F8FC"/>
  <text x="56" y="57" fill="#142B4D" font-family="Inter, 'Noto Sans JP', sans-serif" font-size="27" font-weight="750">PlanMo｜共創アイコン 3案</text>
  <text x="56" y="89" fill="#64748B" font-family="Inter, 'Noto Sans JP', sans-serif" font-size="14">プランナーとモデラーのつながりが、ひとつの立体作品になるイメージ</text>
  <g font-family="Inter, 'Noto Sans JP', sans-serif">
